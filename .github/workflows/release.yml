name: Release

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
          - target: x86_64-apple-darwin
            os: macos-13
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          archive="gdeye-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C target/${{ matrix.target }}/release gdeye -C "$GITHUB_WORKSPACE" LICENSE.md README.md
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $archive = "gdeye-${{ github.event.release.tag_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/gdeye.exe", "LICENSE.md", "README.md" -DestinationPath $archive
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ${{ env.ARCHIVE }} --clobber

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
